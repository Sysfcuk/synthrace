[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
wgpu = { version = "=30.0.2", default-features = false, features = ["wgsl", "webgpu", "webgl"] }
glam = { version = "0.30", default-features = false, features = ["std", "bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
