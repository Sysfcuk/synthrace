name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.22.2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (native)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (native; includes naga WGSL → GLSL ES 3.00 validation)
        run: cargo test --workspace
      - name: Install trunk
        run: |
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin
          trunk --version
      - name: Build web bundle
        run: trunk build --release --public-url /${{ github.event.repository.name }}/
      - name: Clippy (wasm)
        run: cargo clippy -p game -p dsp-worklet --target wasm32-unknown-unknown -- -D warnings
      - name: Size budget
        run: tools/size_report.sh dist | tee -a "$GITHUB_STEP_SUMMARY"
