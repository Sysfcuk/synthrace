[package]
name = "dsp-worklet"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

# Thin cdylib for the AudioWorklet: plain extern "C" exports, no wasm-bindgen,
# no imports, so it can be instantiated synchronously inside AudioWorkletGlobalScope.
[lib]
crate-type = ["cdylib"]

[dependencies]
dsp = { path = "../dsp" }
