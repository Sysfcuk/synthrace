[package]
name = "game"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
render = { path = "../render" }
sim = { path = "../sim" }
procgen = { path = "../procgen" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu.workspace = true
log.workspace = true
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "CssStyleDeclaration",
  "Event", "EventTarget", "KeyboardEvent", "PointerEvent", "Location", "UrlSearchParams",
  "Performance", "Navigator", "console", "DomTokenList",
  "AudioContext", "BaseAudioContext", "AudioContextState", "AudioNode", "AudioDestinationNode",
  "AudioWorklet", "Worklet", "AudioWorkletNode", "AudioWorkletNodeOptions", "MessagePort", "MessageEvent",
  "Blob", "BlobPropertyBag", "Url", "Gamepad", "GamepadButton",
] }
