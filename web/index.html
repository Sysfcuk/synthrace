<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0221">
  <title>SYNTHRACE</title>
  <link data-trunk rel="rust" href="../crates/game" data-wasm-opt="3" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" data-bindgen-target="web" />
  <style>
    html, body { margin: 0; height: 100%; background: #0b0221; overflow: hidden; }
    canvas#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; outline: none; }
    #start {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
      background: radial-gradient(ellipse at 50% 60%, rgba(11,2,33,0.15), rgba(11,2,33,0.75));
      font: 700 clamp(18px, 3.2vw, 34px)/1.3 ui-monospace, "Courier New", monospace; letter-spacing: 0.25em;
      color: #ffe3f6; text-shadow: 0 0 12px #ff2e97, 0 0 28px #ff2e97; cursor: pointer; user-select: none;
      border: 0; width: 100%;
    }
    #start small { font-size: 0.45em; letter-spacing: 0.2em; color: #9ff7ff; text-shadow: 0 0 10px #00f0ff; margin-top: 1.2em; }
    #start.hidden { display: none; }
    #hud {
      position: fixed; left: max(8px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top));
      font: 12px/1.35 ui-monospace, monospace; color: #9ff7ff; background: rgba(11,2,33,0.55);
      padding: 6px 8px; border-radius: 4px; white-space: pre; pointer-events: none;
    }
    #fatal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px;
      color: #ffe3f6; font: 16px/1.5 system-ui, sans-serif; text-align: center; background: #0b0221; }
    /* Minimal driving HUD (the in-engine HUD arrives in M3). */
    #dash { position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom));
      text-align: right; pointer-events: none; font: 700 14px/1 ui-monospace, monospace; color: #9ff7ff;
      text-shadow: 0 0 8px #00f0ff; letter-spacing: 0.1em; }
    #hud-speed { font-size: clamp(36px, 7vw, 64px); color: #ffe3f6; text-shadow: 0 0 12px #ff2e97, 0 0 26px #ff2e97; }
    #dash small { opacity: 0.8; }
    #nitro { width: clamp(120px, 22vw, 220px); height: 10px; margin: 10px 0 0 auto; border: 1px solid #00f0ff;
      box-shadow: 0 0 8px #00f0ff; background: linear-gradient(90deg, transparent 33%, rgba(0,240,255,.5) 33.3%, transparent 33.6%, transparent 66.4%, rgba(0,240,255,.5) 66.6%, transparent 67%); }
    #nitro-fill { height: 100%; width: 0; background: linear-gradient(90deg, #2d6bff, #00f0ff); box-shadow: 0 0 12px #00f0ff; }
    #nitro-fill.burn { background: linear-gradient(90deg, #ff2e97, #ffc94d); box-shadow: 0 0 14px #ff2e97; }
    #callout { position: fixed; left: 50%; top: 28%; transform: translate(-50%, -50%) scale(.8); opacity: 0; pointer-events: none;
      font: 800 clamp(26px, 6vw, 56px)/1 ui-monospace, monospace; letter-spacing: 0.18em; color: #fff; white-space: nowrap; }
    #callout.show { animation: pop .9s ease-out forwards; }
    #callout.hot { text-shadow: 0 0 10px #ff2e97, 0 0 30px #ff2e97; }
    #callout.cool { text-shadow: 0 0 10px #00f0ff, 0 0 30px #00f0ff; }
    #callout.warn { color: #ffe3f6; text-shadow: 0 0 10px #ff2e2e, 0 0 30px #ff2e2e; }
    @keyframes pop { 0% { opacity: 0; transform: translate(-50%,-50%) scale(1.4); } 15% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
      70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-60%) scale(1); } }
    /* Touch controls: steer by holding anywhere on the road; buttons for brake / drift / nitro. */
    #touch { display: none; }
    #touch.on { display: block; }
    #touch button { position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); width: 78px; height: 78px; border-radius: 50%;
      border: 2px solid #00f0ff; background: rgba(11,2,33,0.35); color: #9ff7ff; font: 700 12px ui-monospace, monospace;
      letter-spacing: 0.1em; box-shadow: 0 0 10px rgba(0,240,255,.6); touch-action: none; user-select: none; -webkit-user-select: none; }
    #touch button.held { background: rgba(0,240,255,0.35); color: #fff; }
    #tb-brake { left: max(18px, env(safe-area-inset-left)); }
    #tb-drift { right: calc(max(18px, env(safe-area-inset-right)) + 96px); bottom: calc(max(18px, env(safe-area-inset-bottom)) + 70px) !important; }
    #tb-nitro { right: max(18px, env(safe-area-inset-right)); bottom: calc(max(18px, env(safe-area-inset-bottom)) + 120px) !important;
      border-color: #ff2e97 !important; color: #ffd0ea !important; box-shadow: 0 0 10px rgba(255,46,151,.7) !important; }
    #rotate { display: none; position: fixed; left: 50%; top: 12px; transform: translateX(-50%); padding: 6px 12px; border-radius: 4px;
      background: rgba(11,2,33,.7); color: #ffe3f6; font: 12px ui-monospace, monospace; pointer-events: none; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: block; } }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <button id="start" type="button">PRESS START<small>ARROWS DRIVE · SPACE DRIFT · N NITRO · M MUTE · GAMEPAD &amp; TOUCH OK</small></button>
  <div id="hud">booting…</div>
  <div id="dash"><div><span id="hud-speed">0</span> <small>KM/H</small></div><div><small>GEAR</small> <span id="hud-gear">1</span></div><div id="nitro"><div id="nitro-fill"></div></div></div>
  <div id="callout"></div>
  <div id="touch"><button id="tb-brake" type="button">BRAKE</button><button id="tb-drift" type="button">DRIFT</button><button id="tb-nitro" type="button">NITRO</button></div>
  <div id="rotate">↻ ROTATE FOR LANDSCAPE</div>
  <div id="fatal"></div>
  <noscript><div style="color:#fff;padding:2em">SYNTHRACE needs JavaScript and WebGL2.</div></noscript>
</body>
</html>
